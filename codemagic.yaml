workflows:
  ios-smoke-test:
    name: iOS Smoke Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Launch iOS simulator
        script: |
          flutter emulators --launch apple_ios_simulator
          sleep 15
      - name: Run the launch smoke test
        script: |
          flutter test integration_test/app_smoke_test.dart -d ios
    artifacts:
      - build/ios/**/*.png
      - flutter_drive.log
